<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestão · Pesquisa de Satisfação | NutriBlu</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--green:#1F4E3D;--green-2:#2B6A53;--orange:#E08A2E;--cream:#FBF8F1;--ink:#1B2B25;--muted:#5E6F67;--line:#E6E0D2;--card:#fff;--ok:#1F7A4D;--ok2:#6BAF3F;--warn:#E08A2E;--bad:#C5432F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.45}
.hdr{background:var(--green);color:#fff;position:sticky;top:0;z-index:20}
.hdr .in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--orange);display:inline-block}
.brand small{font-weight:500;opacity:.8;font-size:13px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#DCEBE3;font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:rgba(255,255,255,.16);color:#fff}
nav button:hover{background:rgba(255,255,255,.1)}
.badge{background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px}
.out{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:20px}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.filters label,.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
select,input[type=text],input[type=password],input[type=date],input[type=number],textarea{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--green-2);box-shadow:0 0 0 3px rgba(43,106,83,.15)}
textarea{width:100%;min-height:74px}
.chips{display:flex;gap:6px}
.chip-b{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip-b.on{background:var(--green);border-color:var(--green);color:#fff}
.btn{background:var(--green);color:#fff;border:0;border-radius:11px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--green-2)}
.btn.alt{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.or{background:var(--orange)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.g2{grid-template-columns:2fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 22px -16px rgba(31,78,61,.4)}
.card h3{margin:0 0 12px;font-size:15px;color:var(--green)}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:34px;font-weight:800;color:var(--green);line-height:1.15;margin:4px 0}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.mid .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.kpi .s b{color:var(--orange)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:6px;background:#EEE8D9;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:6px}
.scroll{overflow:auto}
.rchip{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px;color:#fff;background:var(--c);white-space:nowrap}
.cm{border-top:1px solid var(--line);padding:16px 0}.cm:first-child{border-top:0}
.cm .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cm .who b{font-size:15px}.cm .who span{color:var(--muted);font-size:13px;margin-left:6px}
.bubble{background:var(--cream);border-radius:12px;padding:12px 14px;word-wrap:break-word;white-space:pre-wrap}
.rep{margin:8px 0 0 18px;border-left:4px solid var(--green-2);background:#EAF3EE;border-radius:0 12px 12px 0;padding:10px 13px;white-space:pre-wrap}
.rep small{display:block;font-weight:700;color:var(--green);margin-bottom:3px}
.rf{display:flex;gap:8px;margin:10px 0 0 18px;align-items:flex-start}
.rf textarea{min-height:56px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.f{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.win{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#FFF3E2;border:2px solid var(--orange);margin-bottom:10px}
.win.sup{background:#F4F1E8;border-color:var(--line)}
.win .m{font-size:34px}
.win b{font-size:19px;color:var(--green)}
.win small{display:block;color:var(--muted)}
.shuffle{font-size:30px;font-weight:800;color:var(--green);text-align:center;padding:26px;background:#EAF3EE;border-radius:14px;min-height:96px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:12px;z-index:100;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);font-weight:600}
.toast.err{background:var(--bad)}
.mask{position:fixed;inset:0;background:rgba(15,30,24,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.dlg h3{margin:0 0 12px;color:var(--green);font-size:18px}
.dlg .act{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.spin{width:34px;height:34px;border:4px solid #DCE8E1;border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:50px auto}
@keyframes s{to{transform:rotate(360deg)}}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.err{background:#FDECE8;border:1px solid #F3C2B8;color:#8A2A1A;padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px}
.muted{color:var(--muted)}
.unit{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.unit .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;background:#EAF3EE;color:var(--green);padding:3px 9px;border-radius:999px;font-weight:700}
.tag.off{background:#F3E1DC;color:var(--bad)}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}main{padding:14px}.kpi .v{font-size:30px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SB_URL="https://yfbmpvmavjwuedphyrsa.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmYm1wdm1hdmp3dWVkcGh5cnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTQ0MjYsImV4cCI6MjEwNjE5MDQyNn0.2clDzH9PT4IwkUYDVc6VHH3h8Gq2mWKKw1e3d-zeaeA";
const RATINGS=[{v:4,t:"Muito satisfeito",e:"😄",c:"#1F7A4D"},{v:3,t:"Satisfeito",e:"🙂",c:"#6BAF3F"},{v:2,t:"Insatisfeito",e:"🙁",c:"#E08A2E"},{v:1,t:"Muito insatisfeito",e:"😠",c:"#C5432F"}];
const R=v=>RATINGS.find(r=>r.v===v);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("sv-SE")};
const fd=d=>{const[y,m,x]=String(d).slice(0,10).split("-");return`${x}/${m}/${y}`};
const fdt=i=>new Date(i).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const pct=v=>(+v).toFixed(1).replace(".",",")+"%";
const num2=v=>(+v).toFixed(2).replace(".",",");
const S={token:sessionStorage.getItem("ns_admin"),units:[],unit:"",from:iso(-29),to:iso(0),tab:"dash",charts:{},pending:0,cf:{status:"pending",rating:""}};

async function api(fn,args={}){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY},body:JSON.stringify(args)});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((d&&d.message)||"Falha na comunicação. Tente novamente.");
  return d;
}
async function A(fn,args={}){
  try{return await api(fn,{p_token:S.token,...args})}
  catch(e){if(/Sessão da gestão expirada/.test(e.message)){logout(true)}throw e}
}
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function dialog(html){const m=document.createElement("div");m.className="mask";m.innerHTML=`<div class="dlg">${html}</div>`;m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
const unitArg=()=>S.unit||null;

/* ---------- Login / shell ---------- */
function loginView(msg){
  $("#root").innerHTML=`<div class="login"><div class="card">
    <div class="brand" style="color:var(--green);margin-bottom:4px"><i></i>NutriBlu</div>
    <h3 style="font-size:20px;margin:0 0 4px">Gestão da Pesquisa de Satisfação</h3>
    <p class="muted" style="margin:0 0 14px">Acesso restrito à gestão.</p>
    <form id="lf"><div class="f"><label>Senha de acesso</label><input id="pw" type="password" style="width:100%" autocomplete="current-password" autofocus></div>
    <button class="btn" style="width:100%" id="lb">Entrar</button><div id="lm">${msg?`<div class="err">${esc(msg)}</div>`:""}</div></form></div></div>`;
  $("#lf").addEventListener("submit",async e=>{
    e.preventDefault();const b=$("#lb");b.disabled=true;
    try{const o=await api("admin_login",{p_pass:$("#pw").value});
      if(!o.ok)throw new Error(o.message);
      S.token=o.token;sessionStorage.setItem("ns_admin",o.token);await boot();
    }catch(er){$("#lm").innerHTML=`<div class="err">${esc(er.message)}</div>`;b.disabled=false}
  });
}
function logout(expired){S.token=null;sessionStorage.removeItem("ns_admin");loginView(expired?"Sessão expirada. Entre novamente.":"")}

const TABS=[["dash","Dashboard"],["comments","Comentários"],["raffle","Sorteio"],["people","Participantes"],["units","Unidades"]];
function shell(){
  $("#root").innerHTML=`<div class="hdr"><div class="in">
    <div class="brand"><i></i>NutriBlu <small>Pesquisa de Satisfação</small></div>
    <nav id="nav"></nav><button class="out" onclick="logout()">Sair</button></div></div>
    <main><div id="flt"></div><div id="body"></div></main>`;
  renderNav();
}
function renderNav(){
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${l}${k==="comments"&&S.pending>0?`<span class="badge">${S.pending}</span>`:""}</button>`).join("");
}
function go(t){S.tab=t;renderNav();render()}
function unitOptions(sel,all=true){return(all?`<option value="">Todas as unidades</option>`:"")+S.units.map(u=>`<option value="${u.id}" ${u.id===sel?"selected":""}>${esc(u.name)}</option>`).join("")}

function filtersBar(){
  const show=["dash","comments","people"].includes(S.tab);
  const f=$("#flt");if(!show){f.innerHTML="";return}
  f.innerHTML=`<div class="filters">
    <div><label>Unidade</label><select id="fu">${unitOptions(S.unit)}</select></div>
    <div><label>De</label><input type="date" id="ff" value="${S.from}"></div>
    <div><label>Até</label><input type="date" id="ft" value="${S.to}"></div>
    <div class="chips">${[[6,"7 dias"],[14,"15 dias"],[29,"30 dias"],[89,"90 dias"]].map(([o,l])=>`<button class="chip-b ${S.from===iso(-o)&&S.to===iso(0)?"on":""}" onclick="quick(${o})">${l}</button>`).join("")}</div></div>`;
  $("#fu").onchange=e=>{S.unit=e.target.value;render()};
  $("#ff").onchange=e=>{S.from=e.target.value;render()};
  $("#ft").onchange=e=>{S.to=e.target.value;render()};
}
function quick(o){S.from=iso(-o);S.to=iso(0);render()}

async function boot(){
  shell();$("#body").innerHTML=`<div class="spin"></div>`;
  try{S.units=await A("admin_list_units");render()}catch(e){if(S.token)$("#body").innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function render(){
  renderNav();filtersBar();
  const fn={dash:tabDash,comments:tabComments,raffle:tabRaffle,people:tabPeople,units:tabUnits}[S.tab];
  $("#body").innerHTML=`<div class="spin"></div>`;
  fn().catch(e=>{$("#body").innerHTML=`<div class="err">${esc(e.message)}</div>`});
}

/* ---------- Dashboard ---------- */
function killCharts(){Object.values(S.charts).forEach(c=>c.destroy());S.charts={}}
async function tabDash(){
  killCharts();
  const d=await A("admin_dashboard",{p_unit:unitArg(),p_from:S.from,p_to:S.to});
  const k=d.kpis,p=d.participants;S.pending=k.pending;renderNav();
  if(!k.total){$("#body").innerHTML=`<div class="card empty"><div style="font-size:44px">📊</div><h3>Ainda não há respostas neste período</h3><p>Assim que os participantes começarem a responder, os indicadores aparecem aqui.</p></div>`;return}
  const cs=+k.csat,cls=cs>=85?"ok":cs>=70?"mid":"bad";
  const adhesion=p.active?Math.round(100*d.answered_today/p.active):0;
  $("#body").innerHTML=`
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Respostas no período</div><div class="v">${k.total}</div><div class="s">${k.respondents} participantes diferentes</div></div>
    <div class="card kpi ${cls}"><div class="l">Satisfação</div><div class="v">${pct(k.csat)}</div><div class="s">Satisfeito + Muito satisfeito</div></div>
    <div class="card kpi"><div class="l">Nota média</div><div class="v">${num2(k.avg_score)}<span style="font-size:16px;color:var(--muted)"> / 4</span></div><div class="s">1 = muito insatisfeito · 4 = muito satisfeito</div></div>
    <div class="card kpi"><div class="l">Adesão hoje</div><div class="v">${adhesion}%</div><div class="s">${d.answered_today} de ${p.active} participantes ativos</div></div>
    <div class="card kpi"><div class="l">Comentários</div><div class="v">${k.comments}</div><div class="s">${k.pending>0?`<b>${k.pending} aguardando resposta</b>`:"Todos respondidos"}</div></div>
    <div class="card kpi"><div class="l">Cadastrados</div><div class="v">${p.total}</div><div class="s">${p.active} com período ativo</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><h3>Evolução diária: satisfação e volume de respostas</h3><div style="height:300px"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Distribuição das avaliações</h3><div style="height:220px"><canvas id="c2"></canvas></div><div id="lg" style="margin-top:10px"></div></div>
  </div>
  ${d.by_unit.length>1?`<div class="card"><h3>Comparativo entre unidades</h3><div class="scroll"><table><thead><tr><th>Unidade</th><th>Respostas</th><th>Participantes</th><th>Satisfação</th><th></th><th>Nota média</th><th>Comentários</th></tr></thead><tbody>
  ${d.by_unit.map(u=>{const c=+u.csat,col=c>=85?"var(--ok)":c>=70?"var(--warn)":"var(--bad)";return`<tr><td><b>${esc(u.name)}</b></td><td>${u.count}</td><td>${u.respondents}</td><td><b style="color:${u.count?col:"var(--muted)"}">${u.count?pct(u.csat):"—"}</b></td><td style="width:22%"><div class="bar"><i style="width:${u.count?c:0}%;background:${col}"></i></div></td><td>${u.count?num2(u.avg):"—"}</td><td>${u.comments}</td></tr>`}).join("")}</tbody></table></div></div>`:""}`;
  const days=d.daily.map(x=>fd(x.date).slice(0,5));
  S.charts.a=new Chart($("#c1"),{data:{labels:days,datasets:[
    {type:"bar",label:"Respostas",data:d.daily.map(x=>x.count),backgroundColor:"rgba(224,138,46,.35)",yAxisID:"y1",borderRadius:6},
    {type:"line",label:"Satisfação (%)",data:d.daily.map(x=>+x.csat),borderColor:"#1F4E3D",backgroundColor:"#1F4E3D",tension:.3,pointRadius:3,yAxisID:"y"}]},
    options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%"},grid:{color:"#EEE8D9"}},y1:{position:"right",beginAtZero:true,grid:{display:false},ticks:{precision:0}},x:{grid:{display:false}}},plugins:{legend:{position:"bottom"}}}});
  const dist=RATINGS.map(r=>d.distribution.find(x=>x.rating===r.v)?.count||0);
  S.charts.b=new Chart($("#c2"),{type:"doughnut",data:{labels:RATINGS.map(r=>r.t),datasets:[{data:dist,backgroundColor:RATINGS.map(r=>r.c),borderWidth:2,borderColor:"#fff"}]},options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});
  $("#lg").innerHTML=RATINGS.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${r.c};margin-right:8px"></span>${r.e} ${r.t}</span><b>${dist[i]} <span class="muted" style="font-weight:500">(${k.total?Math.round(100*dist[i]/k.total):0}%)</span></b></div>`).join("");
}

/* ---------- Comentários ---------- */
async function tabComments(){
  const list=await A("admin_list_comments",{p_unit:unitArg(),p_from:S.from,p_to:S.to,p_status:S.cf.status,p_rating:S.cf.rating?+S.cf.rating:null});
  const pend=await A("admin_list_comments",{p_unit:unitArg(),p_from:S.from,p_to:S.to,p_status:"pending"});S.pending=pend.length;renderNav();
  $("#body").innerHTML=`<div class="card">
    <div class="row" style="margin-bottom:8px">
      <div class="f"><label>Situação</label><select id="cs"><option value="pending">Aguardando resposta</option><option value="replied">Respondidos</option><option value="all">Todos</option></select></div>
      <div class="f"><label>Avaliação</label><select id="cr"><option value="">Todas</option>${RATINGS.map(r=>`<option value="${r.v}">${r.e} ${r.t}</option>`).join("")}</select></div>
      <div class="muted f" style="margin-left:auto">${list.length} comentário${list.length===1?"":"s"}</div></div>
    ${list.length?list.map(c=>{const r=R(c.rating);return`<div class="cm" id="cm-${c.id}">
      <div class="top"><div class="who"><b>${esc(c.name)}</b><span>Mat. ${esc(c.matricula)} · ${esc(c.unit)} · ${fd(c.date)}</span></div><span class="rchip" style="--c:${r.c}">${r.e} ${r.t}</span></div>
      <div class="bubble">${esc(c.comment)}</div>
      ${c.replies.map(x=>`<div class="rep"><small>Resposta enviada · ${fdt(x.created_at)} ${x.read?"· ✓ lida":"· não lida"}</small>${esc(x.message)}</div>`).join("")}
      <div class="rf"><textarea id="rt-${c.id}" maxlength="1000" placeholder="Escreva a resposta que o participante verá na pesquisa..."></textarea><button class="btn sm" onclick="sendReply('${c.id}')">Responder</button></div></div>`}).join(""):`<div class="empty">Nenhum comentário para este filtro. 🎉</div>`}</div>`;
  $("#cs").value=S.cf.status;$("#cr").value=S.cf.rating;
  $("#cs").onchange=e=>{S.cf.status=e.target.value;render()};
  $("#cr").onchange=e=>{S.cf.rating=e.target.value;render()};
}
async function sendReply(id){
  const t=$("#rt-"+id).value.trim();if(!t)return toast("Escreva a resposta antes de enviar.",1);
  try{await A("admin_reply",{p_response_id:id,p_message:t});toast("Resposta enviada ao participante ✓");render()}catch(e){toast(e.message,1)}
}

/* ---------- Sorteio ---------- */
let pvTimer=null;
async function tabRaffle(){
  const hist=await A("admin_list_raffles");
  $("#body").innerHTML=`<div class="grid g2">
   <div class="card"><h3>Novo sorteio</h3>
    <div class="row"><div class="f" style="flex:1;min-width:200px"><label>Nome do sorteio</label><input type="text" id="rn" style="width:100%" placeholder="Ex.: Sorteio de outubro"></div>
    <div class="f"><label>Unidade</label><select id="ru">${unitOptions("")}</select></div></div>
    <div class="row"><div class="f"><label>Período: de</label><input type="date" id="rf" value="${S.from}"></div><div class="f"><label>até</label><input type="date" id="rt" value="${S.to}"></div>
    <div class="f"><label>Ganhadores</label><input type="number" id="rw" min="1" max="10" value="1" style="width:90px"></div>
    <div class="f"><label>Mín. respostas</label><input type="number" id="rm" min="1" value="1" style="width:110px"></div></div>
    <label style="display:flex;gap:9px;align-items:center;margin:4px 0 12px;font-size:14px"><input type="checkbox" id="rwt" checked style="width:18px;height:18px;accent-color:var(--green)"> Cada resposta vale uma chance (quem participou mais tem mais chances)</label>
    <div id="pv" class="muted" style="margin-bottom:12px">Calculando participantes elegíveis...</div>
    <button class="btn or" id="rd" disabled>🎲 Realizar sorteio</button>
    <p class="muted" style="font-size:12.5px;margin-top:10px">O resultado é gravado com o período, as regras e a lista de elegíveis, para consulta e auditoria.</p>
    <div id="res" style="margin-top:14px"></div></div>
   <div class="card"><h3>Sorteios realizados</h3>${hist.length?hist.map(h=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${esc(h.name)}</b><div class="muted" style="font-size:13px">${esc(h.unit)} · ${fd(h.period_start)} a ${fd(h.period_end)}<br>${h.eligible} elegíveis · ${h.tickets} chances · sorteado em ${fdt(h.drawn_at)}</div>
     ${h.winners.map(w=>`<div style="font-size:14px;margin-top:4px">${w.position===1?"🏆":"🥈"} <b>${esc(w.name)}</b> <span class="muted">· mat. ${esc(w.matricula)} · ${esc(w.unit)}${w.position>1?" · suplente":""}</span></div>`).join("")}</div>`).join(""):`<div class="empty">Nenhum sorteio realizado ainda.</div>`}</div></div>`;
  ["ru","rf","rt","rm","rwt"].forEach(i=>$("#"+i).addEventListener("change",previewRaffle));
  $("#rd").onclick=doRaffle;previewRaffle();
}
let eligible=[];
async function previewRaffle(){
  clearTimeout(pvTimer);
  pvTimer=setTimeout(async()=>{
    const pv=$("#pv");if(!pv)return;
    try{
      const l=await A("admin_participants",{p_unit:$("#ru").value||null,p_from:$("#rf").value,p_to:$("#rt").value});
      const min=Math.max(1,+$("#rm").value||1),w=$("#rwt").checked;
      eligible=l.filter(x=>x.responses>=min);
      const tix=eligible.reduce((a,x)=>a+(w?x.responses:1),0);
      pv.innerHTML=eligible.length?`<b style="color:var(--green)">${eligible.length}</b> participantes elegíveis · <b style="color:var(--green)">${tix}</b> chances no total`:`<span style="color:var(--bad)">Nenhum participante elegível neste período.</span>`;
      $("#rd").disabled=!eligible.length;
    }catch(e){pv.textContent=e.message}
  },250);
}
async function doRaffle(){
  const n=Math.min(10,Math.max(1,+$("#rw").value||1));
  if(!confirm(`Realizar o sorteio agora com ${eligible.length} participantes elegíveis?\n\nO resultado não pode ser refeito.`))return;
  const btn=$("#rd");btn.disabled=true;
  let out;
  try{out=await A("admin_draw",{p_unit:$("#ru").value||null,p_from:$("#rf").value,p_to:$("#rt").value,p_name:$("#rn").value,p_weighted:$("#rwt").checked,p_min_responses:Math.max(1,+$("#rm").value||1),p_winners:n})}
  catch(e){toast(e.message,1);btn.disabled=false;return}
  const box=$("#res");box.innerHTML=`<div class="shuffle" id="sh">🎲</div>`;
  const names=eligible.map(x=>x.name);let i=0;
  const iv=setInterval(()=>{$("#sh").textContent=names[Math.floor(Math.random()*names.length)]||"🎲";i++},80);
  setTimeout(()=>{clearInterval(iv);
    box.innerHTML=`<h3 style="margin:0 0 8px">🎉 Resultado — ${esc(out.name)}</h3>`+out.winners.map(w=>`<div class="win ${w.position>1?"sup":""}"><div class="m">${w.position===1?"🏆":"🥈"}</div><div><b>${esc(w.name)}</b><small>Matrícula ${esc(w.matricula)} · ${esc(w.unit)} · ${w.tickets} ${w.tickets===1?"chance":"chances"}${w.position>1?" · suplente "+(w.position-1):" · ganhador"}</small></div></div>`).join("")+`<button class="btn alt sm" id="cp">Copiar resultado</button>`;
    $("#cp").onclick=()=>{const t=`${out.name} (${fd(out.period_start)} a ${fd(out.period_end)})\n`+out.winners.map(w=>`${w.position===1?"Ganhador":"Suplente "+(w.position-1)}: ${w.name} — mat. ${w.matricula} — ${w.unit}`).join("\n");navigator.clipboard?.writeText(t);toast("Resultado copiado")};
    btn.disabled=false;
  },2400);
}

/* ---------- Participantes ---------- */
async function tabPeople(){
  const l=await A("admin_participants",{p_unit:unitArg(),p_from:S.from,p_to:S.to});
  $("#body").innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><div class="f" style="flex:1"><label>Buscar</label><input type="text" id="q" placeholder="Nome ou matrícula" style="width:100%;max-width:340px"></div>
    <div class="muted f">${l.length} participantes · respostas contadas no período selecionado</div><button class="btn alt sm" id="csv">Exportar CSV</button></div>
    <div class="scroll"><table><thead><tr><th>Nome</th><th>Matrícula</th><th>Unidade</th><th>Cadastro</th><th>Acesso até</th><th>Respostas</th><th>Última</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const draw=q=>{const f=l.filter(x=>(x.name+" "+x.matricula).toLowerCase().includes(q.toLowerCase()));
    $("#tb").innerHTML=f.length?f.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.matricula)}</td><td>${esc(x.unit)}</td><td>${fd(x.registered)}</td><td>${fd(x.expires_at)}${new Date(x.expires_at)<new Date()?' <span class="tag off">encerrado</span>':""}</td><td><b>${x.responses}</b></td><td>${x.last?fd(x.last):"—"}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">Nenhum participante encontrado.</td></tr>`};
  draw("");$("#q").oninput=e=>draw(e.target.value);
  $("#csv").onclick=()=>{const rows=[["Nome","Matricula","Unidade","Cadastro","Acesso ate","Respostas no periodo","Ultima resposta"],...l.map(x=>[x.name,x.matricula,x.unit,fd(x.registered),fd(x.expires_at),x.responses,x.last?fd(x.last):""])];
    const csv="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`participantes_${S.from}_${S.to}.csv`;a.click()};
}

/* ---------- Unidades ---------- */
const linkFor=s=>`https://joaquimfoscarini-bit.github.io/pesquisa-satisfacao-nutriblu/?u=${s}`;
async function tabUnits(){
  S.units=await A("admin_list_units");
  $("#body").innerHTML=`<div class="grid g2"><div>
   <div class="card" style="margin-bottom:14px"><h3>Nova unidade</h3><div class="row"><div class="f" style="flex:1;min-width:200px"><label>Nome</label><input type="text" id="nn" style="width:100%" placeholder="Ex.: Blumenau Iluminação"></div>
   <div class="f"><label>Identificador do link</label><input type="text" id="ns" placeholder="blumenau-iluminacao"></div><div class="f"><button class="btn" onclick="newUnit()">Criar</button></div></div></div>
   ${S.units.map(u=>`<div class="unit"><div class="h"><div><b style="font-size:17px">${esc(u.name)}</b> <span class="tag ${u.active?"":"off"}">${u.active?"ativa":"pausada"}</span></div>
     <div class="muted" style="font-size:13px">${u.participants} cadastrados${u.require_roster?` · ${u.roster} matrículas na lista`:""}</div></div>
     <div class="row"><div class="f"><label>Nome</label><input type="text" id="un-${u.id}" value="${esc(u.name)}"></div>
     <div class="f"><label>Dias de participação</label><input type="number" id="ud-${u.id}" min="1" max="90" value="${u.window_days}" style="width:100px"></div>
     <label style="display:flex;gap:7px;align-items:center;font-size:14px;margin-bottom:12px"><input type="checkbox" id="ua-${u.id}" ${u.active?"checked":""}> Ativa</label>
     <label style="display:flex;gap:7px;align-items:center;font-size:14px;margin-bottom:12px" title="Só matrículas da lista podem se cadastrar"><input type="checkbox" id="ur-${u.id}" ${u.require_roster?"checked":""}> Exigir lista de matrículas</label></div>
     <div class="muted" style="font-size:12.5px;margin-bottom:10px;word-break:break-all">🔗 ${esc(linkFor(u.slug))}</div>
     <div class="row" style="gap:8px"><button class="btn sm" onclick="saveUnit('${u.id}','${esc(u.slug)}')">Salvar</button><button class="btn alt sm" onclick="openQR('${u.id}')">QR Code</button><button class="btn alt sm" onclick="copyLink('${esc(u.slug)}')">Copiar link</button><button class="btn alt sm" onclick="rosterDlg('${u.id}')">Lista de matrículas</button><button class="btn alt sm" onclick="extendDlg('${u.id}')">Renovar período</button></div></div>`).join("")}
   </div><div class="card"><h3>Segurança</h3><div class="f"><label>Nova senha da gestão</label><input type="password" id="np" style="width:100%" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div><button class="btn sm" onclick="changePass()">Alterar senha</button>
   <p class="muted" style="font-size:13px;margin-top:14px">Quem tem a senha vê nomes, matrículas e comentários. Compartilhe apenas com a gestão.</p></div></div>`;
}
async function newUnit(){try{await A("admin_upsert_unit",{p_id:null,p_slug:$("#ns").value||$("#nn").value,p_name:$("#nn").value,p_active:true,p_require_roster:false,p_window_days:15});toast("Unidade criada ✓");tabUnits()}catch(e){toast(e.message,1)}}
async function saveUnit(id,slug){try{await A("admin_upsert_unit",{p_id:id,p_slug:slug,p_name:$("#un-"+id).value,p_active:$("#ua-"+id).checked,p_require_roster:$("#ur-"+id).checked,p_window_days:+$("#ud-"+id).value||15});toast("Unidade salva ✓");tabUnits()}catch(e){toast(e.message,1)}}
function copyLink(s){navigator.clipboard?.writeText(linkFor(s));toast("Link copiado")}
async function changePass(){try{await A("admin_change_pass",{p_new:$("#np").value});toast("Senha alterada ✓");$("#np").value=""}catch(e){toast(e.message,1)}}
function rosterDlg(id){const u=S.units.find(x=>x.id===id);
  const m=dialog(`<h3>Lista de matrículas — ${esc(u.name)}</h3><p class="muted" style="font-size:14px">Cole uma matrícula por linha (opcional: <code>matrícula;nome</code>). Com a opção "Exigir lista de matrículas" ativa, só quem estiver aqui consegue se cadastrar.</p><textarea id="rl" style="min-height:200px" placeholder="1001;Maria da Silva&#10;1002;João Souza"></textarea><div class="act"><button class="btn alt" id="x">Cancelar</button><button class="btn" id="ok">Importar</button></div>`);
  m.querySelector("#x").onclick=()=>m.remove();
  m.querySelector("#ok").onclick=async()=>{try{const n=await A("admin_import_roster",{p_unit:id,p_lines:m.querySelector("#rl").value});toast(`${n} matrículas importadas ✓`);m.remove();tabUnits()}catch(e){toast(e.message,1)}}}
function extendDlg(id){const u=S.units.find(x=>x.id===id);
  const m=dialog(`<h3>Renovar período — ${esc(u.name)}</h3><p class="muted" style="font-size:14px">Reabre a pesquisa para todos os cadastrados desta unidade a partir de hoje.</p><div class="f"><label>Novos dias de participação</label><input type="number" id="ed" value="${u.window_days}" min="1" max="90"></div><div class="act"><button class="btn alt" id="x">Cancelar</button><button class="btn" id="ok">Renovar</button></div>`);
  m.querySelector("#x").onclick=()=>m.remove();
  m.querySelector("#ok").onclick=async()=>{try{const n=await A("admin_extend_window",{p_unit:id,p_days:+m.querySelector("#ed").value});toast(`${n} participantes renovados ✓`);m.remove();tabUnits()}catch(e){toast(e.message,1)}}}

/* ---------- QR poster ---------- */
function drawPoster(u,cv){
  const url=linkFor(u.slug),W=1080,H=1500,c=cv.getContext("2d");cv.width=W;cv.height=H;
  c.fillStyle="#FBF8F1";c.fillRect(0,0,W,H);
  c.fillStyle="#1F4E3D";c.fillRect(0,0,W,300);
  c.fillStyle="#E08A2E";c.beginPath();c.arc(90,150,18,0,7);c.fill();
  c.fillStyle="#fff";c.font="800 64px Segoe UI, Arial, sans-serif";c.textBaseline="middle";c.fillText("NutriBlu",122,150);
  c.font="500 34px Segoe UI, Arial, sans-serif";c.fillStyle="#DCEBE3";c.fillText(u.name,122,215);
  c.fillStyle="#1F4E3D";c.textAlign="center";c.font="800 74px Segoe UI, Arial, sans-serif";
  c.fillText("Como estava",W/2,410);c.fillText("sua refeição?",W/2,495);
  c.font="500 38px Segoe UI, Arial, sans-serif";c.fillStyle="#5E6F67";
  c.fillText("Responda em 30 segundos, 1 vez por dia,",W/2,580);c.fillText("e concorra ao sorteio!",W/2,630);
  const qs=640,qx=(W-qs)/2,qy=690;
  c.fillStyle="#fff";c.strokeStyle="#E6E0D2";c.lineWidth=4;c.beginPath();c.roundRect(qx-40,qy-40,qs+80,qs+80,36);c.fill();c.stroke();
  const qr=qrcode(0,"M");qr.addData(url);qr.make();const n=qr.getModuleCount(),cell=qs/n;
  c.fillStyle="#1F4E3D";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect(Math.round(qx+k*cell),Math.round(qy+r*cell),Math.ceil(cell),Math.ceil(cell));
  c.fillStyle="#1F4E3D";c.font="700 44px Segoe UI, Arial, sans-serif";c.fillText("Aponte a câmera do celular",W/2,1420-90);
  c.font="500 30px Segoe UI, Arial, sans-serif";c.fillStyle="#5E6F67";c.fillText(url.replace(/^https?:\/\//,""),W/2,1420-35);
  c.fillStyle="#E08A2E";c.fillRect(0,H-24,W,24);
}
function openQR(id){
  const u=S.units.find(x=>x.id===id);
  const m=dialog(`<h3>QR Code — ${esc(u.name)}</h3><canvas id="pc" style="width:100%;max-width:340px;display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px"></canvas><div class="act" style="justify-content:center"><button class="btn alt" id="pr">Imprimir</button><button class="btn" id="dl">Baixar PNG</button><button class="btn alt" id="x">Fechar</button></div>`);
  const cv=m.querySelector("#pc");drawPoster(u,cv);
  m.querySelector("#x").onclick=()=>m.remove();
  m.querySelector("#dl").onclick=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`qr-pesquisa-${u.slug}.png`;a.click()});
  m.querySelector("#pr").onclick=()=>{const w=window.open("");if(!w)return toast("Libere pop-ups para imprimir.",1);w.document.write(`<title>QR ${esc(u.name)}</title><style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style><img src="${cv.toDataURL("image/png")}" onload="setTimeout(()=>print(),200)">`);w.document.close()};
}

if(S.token){boot()}else loginView();
</script>
