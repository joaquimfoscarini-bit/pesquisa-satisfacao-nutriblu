<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F4E3D">
<title>Pesquisa de Satisfação | NutriBlu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4E3D; --green-2:#2B6A53; --green-3:#3E8267; --orange:#E08A2E; --orange-2:#F2A649; --butter:#F6C15C;
  --cream:#FBF8F1; --ink:#16241d; --muted:#5b6a60; --line:rgba(31,78,61,.16); --card:#FFFFFF;
  --ok:#1F7A4D; --ok2:#6BAF3F; --warn:#E08A2E; --bad:#C5432F;
  --wash-g:var(--wash-g); --wash-o:var(--wash-o); --wash-r:var(--wash-r); --wash-r-bd:var(--wash-r-bd); --wash-r-ink:var(--wash-r-ink); --wash-y:var(--wash-y); --wash-y-ink:var(--wash-y-ink); --track:var(--track); --seg:var(--seg); --btn-a:#3E8267; --btn-b:#1F4E3D; --shadow:var(--shadow);
  color-scheme:light;
  --serif:"Fraunces",Georgia,serif;
  --radius:20px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Inter",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.top{background:linear-gradient(180deg,#20553F 0%,#1F4E3D 62%,#193F30 100%);color:#fff;padding:calc(21px + env(safe-area-inset-top)) 20px 28px;position:relative;text-align:center}
.logo-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo-img{width:min(167px,48vw);height:auto;display:block}
.logo-fallback{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:21px;color:#fff}
.logo-fallback i{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--orange)}
.unit-pill{position:relative;z-index:1;display:block;font-size:12.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.wrap{max-width:520px;margin:-22px auto 0;padding:0 16px 40px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px 24px;box-shadow:0 20px 40px -22px var(--shadow);margin-bottom:14px;position:relative}
.tag{display:inline-flex;align-items:center;gap:9px;background:var(--wash-y);color:var(--wash-y-ink);padding:7px 14px 7px 8px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.15px;margin-bottom:16px}
.tag .ic{width:22px;height:22px;flex:none;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:12px}
h1{font-family:var(--serif);font-weight:680;font-size:27px;line-height:1.1;margin:0 0 8px;color:var(--green);letter-spacing:-.3px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:680;font-size:21px;line-height:1.15;margin:0 0 14px;color:var(--green)}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.sub{font-size:12px;color:var(--muted);font-weight:700;margin:-4px 0 14px;text-transform:uppercase;letter-spacing:.6px}
.tabs{display:flex;background:var(--seg);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;border-radius:11px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs button.on{background:var(--card);color:var(--green);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:var(--orange);color:#fff;font-size:12px;font-weight:700}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=password],input[type=tel],textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(43,106,83,.15)}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.btn{width:100%;min-height:56px;border:0;border-radius:14px;background:linear-gradient(155deg,var(--btn-a),var(--btn-b));color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:18px;transition:transform .05s,opacity .2s;box-shadow:0 10px 20px -10px rgba(31,78,61,.55)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:transparent;color:var(--green);border:1.5px solid var(--green);box-shadow:none}
.link{background:none;border:0;color:var(--green-2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:8px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--muted)}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--green)}
.err{background:var(--wash-r);border:1px solid var(--wash-r-bd);color:var(--wash-r-ink);padding:12px 14px;border-radius:12px;margin-top:14px;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 8px 14px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:all .15s;position:relative}
.opt .e{font-size:38px;line-height:1;display:block;margin-bottom:8px;filter:grayscale(.55);transition:filter .15s,transform .15s}
.opt .t{font-weight:700;font-size:14px;display:block}
.opt:hover .e{filter:none}
.opt.sel{box-shadow:0 0 0 2.5px var(--c),0 6px 14px -6px rgba(34,48,28,.3)}
.opt.sel .e{filter:none;transform:scale(1.12)}
.opt.sel::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--c);font-weight:800}
.hero{text-align:center;padding:8px 0 4px}
.hero .big{font-size:52px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--wash-g);color:var(--green);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13.5px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-weight:680;font-size:26px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
.item{border-top:1px solid var(--line);padding:16px 0}
.item:first-child{border-top:0;padding-top:4px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px;color:#fff;background:var(--c)}
.mine{background:var(--cream);border-radius:12px;padding:12px 14px;font-size:15px;word-wrap:break-word}
.reply{margin:10px 0 0 14px;border-left:4px solid var(--green-2);background:var(--wash-g);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.reply small{display:block;color:var(--green);font-weight:700;margin-bottom:4px}
.reply.new{border-left-color:var(--orange);background:var(--wash-o)}
.wait{margin:10px 0 0 14px;font-size:13.5px;color:var(--muted);font-style:italic}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px}
.spin{width:34px;height:34px;border:4px solid var(--track);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap" style="margin:0 auto;padding:0">
    <div class="logo-wrap">
      <img src="logo-white.png?v=3" alt="NutriBlu Gastronomia Empresarial" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="logo-fallback" style="display:none"><i></i> NutriBlu</div>
      <div class="unit-pill" id="unitName">Pesquisa de satisfação</div>
    </div>
  </div>
</header>
<main class="wrap" id="view"><div class="spin" aria-label="Carregando"></div></main>

<script>
const SB_URL = "https://yfbmpvmavjwuedphyrsa.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmYm1wdm1hdmp3dWVkcGh5cnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTQ0MjYsImV4cCI6MjEwNjE5MDQyNn0.2clDzH9PT4IwkUYDVc6VHH3h8Gq2mWKKw1e3d-zeaeA";

const RATINGS = [
  {v:4, t:"Muito satisfeito",   e:"😄", c:"#1F7A4D"},
  {v:3, t:"Satisfeito",         e:"🙂", c:"#6BAF3F"},
  {v:2, t:"Insatisfeito",       e:"🙁", c:"#E08A2E"},
  {v:1, t:"Muito insatisfeito", e:"😠", c:"#C5432F"},
];
const R = v => RATINGS.find(r => r.v === v);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const [y,m,day] = String(d).slice(0,10).split("-"); return `${day}/${m}/${y}`; };
const fmtDT = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

const slug = (new URLSearchParams(location.search).get("u") || "").toLowerCase().trim();
const TK = "ns_token_" + slug;
const CODE_MONTH_KEY = "ns_code_month";
const CODE_VAL_KEY = "ns_code_val";
const state = { unit:null, status:null, tab:"survey", rating:null, comments:null, justAnswered:false };

const curMonth = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const codeOk = () => { try { return localStorage.getItem(CODE_MONTH_KEY) === curMonth() && !!localStorage.getItem(CODE_VAL_KEY); } catch(e){ return false; } };
const savedCode = () => { try { return localStorage.getItem(CODE_VAL_KEY) || ""; } catch(e){ return ""; } };
const setCodeOk = c => { try { localStorage.setItem(CODE_MONTH_KEY, curMonth()); localStorage.setItem(CODE_VAL_KEY, c); } catch(e){} };
const clearCode = () => { try { localStorage.removeItem(CODE_MONTH_KEY); localStorage.removeItem(CODE_VAL_KEY); } catch(e){} };

async function api(fn, args = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer "+SB_KEY },
    body: JSON.stringify(args)
  });
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok) throw new Error((data && data.message) || "Não foi possível concluir. Verifique sua conexão e tente novamente.");
  return data;
}
const token = () => { try { return localStorage.getItem(TK); } catch(e){ return null; } };
const setToken = t => { try { t ? localStorage.setItem(TK,t) : localStorage.removeItem(TK); } catch(e){} };

function view(html){ $("#view").innerHTML = html; window.scrollTo({top:0}); }
function errBox(msg){ return msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ""; }

/* ---------- Boot ---------- */
async function boot(){
  if (!slug) return view(`<div class="card"><h1>Link incompleto</h1><p class="muted">Escaneie novamente o QR Code da sua unidade para acessar a pesquisa.</p></div>`);
  try {
    state.unit = await api("get_unit",{p_slug:slug});
  } catch(e){ return view(`<div class="card"><h1>Sem conexão</h1><p class="muted">${esc(e.message)}</p><button class="btn" onclick="boot()">Tentar de novo</button></div>`); }
  if (!state.unit.found) return view(`<div class="card"><h1>Unidade não encontrada</h1><p class="muted">Escaneie novamente o QR Code da sua unidade.</p></div>`);
  $("#unitName").textContent = state.unit.name;
  if (!codeOk()) return codeGateView();
  continueBoot();
}
async function continueBoot(){
  if (token()) { try { await loadHome(); return; } catch(e){ setToken(null); } }
  authView("register");
}

/* ---------- Código de acesso mensal (impresso no cartaz da unidade) ---------- */
function codeGateView(msg){
  view(`
  <div class="card">
    <div class="tag"><span class="ic">🔒</span>Acesso restrito</div>
    <h1>Código do cartaz</h1>
    <p class="muted">Para continuar, digite o código de acesso deste mês. Ele está impresso no cartaz ao lado do QR Code, na sua unidade.</p>
    <form id="cf" novalidate>
      <label for="code">Código de acesso</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700">
      <div id="cmsg">${errBox(msg)}</div>
      <button class="btn" id="cgo" type="submit">Continuar</button>
    </form>
  </div>
  <p class="foot">Não achou o código? Fale com a gestão da sua unidade.</p>`);
  $("#code").focus();
  $("#cf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("#cgo"); btn.disabled = true; btn.textContent = "Verificando...";
    const c = $("#code").value.trim();
    try {
      const ok = await api("verify_access_code",{p_code:c});
      if (!ok) throw new Error("Código incorreto. Confira o cartaz da sua unidade.");
      setCodeOk(c);
      continueBoot();
    } catch(e){
      $("#cmsg").innerHTML = errBox(e.message);
      btn.disabled = false; btn.textContent = "Continuar";
    }
  });
}

/* ---------- Auth ---------- */
function authTabs(mode){
  return `<div class="tabs" role="tablist">
    <button class="${mode==='register'?"on":""}" onclick="authView('register')">Primeiro acesso</button>
    <button class="${mode==='login'?"on":""}" onclick="authView('login')">Já tenho cadastro</button>
  </div>`;
}
function authView(mode, msg){
  const isReg = mode === "register";
  const days = state.unit.window_days;
  view(`
  <button type="button" class="btn alt" style="margin-top:26px;margin-bottom:14px" onclick="anonView()">Participar sem cadastro</button>
  <div class="card">
    ${isReg ? `<div class="tag"><span class="ic">🎁</span>Concorra a prêmios</div>` : ""}
    <h1>${isReg ? "Cadastre-se" : "Bem-vindo de volta"}</h1>
    ${isReg ? `<div class="sub">Somente no primeiro acesso</div>` : ""}
    <p class="muted">${isReg
      ? `Para concorrer a prêmios, cadastre-se e participe <b>uma vez por dia</b>. Quanto mais participar, mais chances de ganhar!`
      : "Entre com sua matrícula e sua senha para responder ou ver os retornos da gestão."}</p>
    ${authTabs(mode)}
    <form id="f" novalidate>
      ${isReg ? `<label for="name">Nome completo</label><input id="name" type="text" autocomplete="name" maxlength="80" placeholder="Como você se chama?">` : ""}
      <label for="mat">Matrícula</label>
      <input id="mat" type="text" inputmode="text" autocomplete="username" maxlength="20" placeholder="Número da sua matrícula">
      <label for="pin">${isReg ? "Crie uma senha (4 a 6 números)" : "Senha"}</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="${isReg?"new-password":"current-password"}" placeholder="••••">
      ${isReg ? `<div class="hint">Guarde bem sua senha: é com ela que você entra nos próximos dias.</div>
      <label class="check"><input id="consent" type="checkbox">
        <span>Concordo em participar do sorteio e autorizo o uso do meu nome e matrícula pela NutriBlu apenas para esta pesquisa e para o sorteio (LGPD).</span></label>` : ""}
      <div id="msg">${errBox(msg)}</div>
      <button class="btn" id="go" type="submit">${isReg ? "Cadastrar e começar" : "Entrar"}</button>
    </form>
  </div>
  <p class="foot">Suas respostas ajudam a melhorar o cardápio da unidade.</p>`);
  $("#f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true; btn.textContent = "Aguarde...";
    try {
      let out;
      if (isReg) {
        out = await api("register_participant",{p_slug:slug,p_name:$("#name").value,p_matricula:$("#mat").value,p_pin:$("#pin").value,p_consent:$("#consent").checked,p_code:savedCode()});
        setToken(out.token);
      } else {
        out = await api("login_participant",{p_slug:slug,p_matricula:$("#mat").value,p_pin:$("#pin").value});
        if (!out.ok) throw new Error(out.message);
        setToken(out.token);
      }
      await loadHome();
    } catch(e){
      if (/Código de acesso inválido/.test(e.message)) { clearCode(); return codeGateView(e.message); }
      $("#msg").innerHTML = errBox(e.message);
      btn.disabled = false; btn.textContent = isReg ? "Cadastrar e começar" : "Entrar";
    }
  });
}

/* ---------- Anonymous (no registration, no raffle) ---------- */
function anonView(msg){
  state.rating = null;
  view(`
  <div class="card">
    <h1>Responder sem cadastro</h1>
    <p class="muted">Sua resposta ajuda a melhorar o cardápio, mas <b>não conta para o sorteio</b> — só quem se cadastra concorre aos prêmios.</p>
    <h2>Como estava sua refeição hoje?</h2>
    <div class="opts" role="radiogroup" aria-label="Avaliação da refeição">
      ${RATINGS.map(r => `<button type="button" class="opt" role="radio" aria-checked="false" style="--c:${r.c}" data-v="${r.v}"><span class="e">${r.e}</span><span class="t">${r.t}</span></button>`).join("")}
    </div>
    <label for="cm">Quer nos contar mais? <span class="muted" style="font-weight:400">(opcional)</span></label>
    <textarea id="cm" maxlength="1000" placeholder="Elogio, sugestão ou problema — a gestão lê."></textarea>
    <div class="hint" id="cnt">0/1000</div>
    <div id="msg">${errBox(msg)}</div>
    <button class="btn" id="send" disabled>Enviar resposta</button>
  </div>
  <p class="foot"><button type="button" class="link" onclick="authView('register')">Voltar</button></p>`);
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    state.rating = +b.dataset.v;
    document.querySelectorAll(".opt").forEach(x => { const on = x===b; x.classList.toggle("sel",on); x.setAttribute("aria-checked",on); });
    $("#send").disabled = false;
  }));
  $("#cm").addEventListener("input", e => $("#cnt").textContent = e.target.value.length + "/1000");
  $("#send").addEventListener("click", async () => {
    const btn = $("#send"); btn.disabled = true; btn.textContent = "Enviando...";
    try {
      await api("submit_anonymous_response",{p_slug:slug,p_rating:state.rating,p_comment:$("#cm").value,p_code:savedCode()});
      anonThanks();
    } catch(e){
      if (/Código de acesso inválido/.test(e.message)) { clearCode(); return codeGateView(e.message); }
      $("#msg").innerHTML = errBox(e.message);
      btn.disabled = false; btn.textContent = "Enviar resposta";
    }
  });
}
function anonThanks(){
  view(`<div class="card hero pop"><div class="big">🙏</div><h2 style="margin-top:12px">Obrigado pela resposta!</h2>
    <p class="muted">Sua opinião foi registrada. Como você respondeu sem se cadastrar, não participa do sorteio desta vez.</p>
    <button class="btn alt" style="margin-top:8px" onclick="authView('register')">Voltar ao início</button></div>`);
}

/* ---------- Home ---------- */
async function loadHome(){
  state.status = await api("my_status",{p_token:token()});
  state.rating = null; state.justAnswered = false;
  renderHome();
}
function logout(){ setToken(null); authView("login"); }

function renderHome(){
  const s = state.status;
  const unread = s.unread_replies;
  view(`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h1 style="margin:0">Olá, ${esc(s.name.split(" ")[0])}!</h1>
      <button class="link" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="${state.tab==="survey"?"on":""}" onclick="setTab('survey')">Pesquisa</button>
    <button class="${state.tab==="comments"?"on":""}" onclick="setTab('comments')">Meus comentários${unread>0?`<span class="badge">${unread}</span>`:""}</button>
  </div>
  <div id="tab"></div>`);
  state.tab === "survey" ? surveyTab() : commentsTab();
}
function setTab(t){ state.tab = t; renderHome(); }

function surveyTab(){
  const s = state.status;
  if (!s.window_open) {
    $("#tab").innerHTML = `<div class="card hero"><div class="big">🙏</div><h2 style="margin-top:12px">Obrigado por participar!</h2>
      <p class="muted">Seu período de participação terminou. Você respondeu <b>${s.total_responses}</b> ${s.total_responses===1?"vez":"vezes"}. Veja em <b>Meus comentários</b> se a gestão respondeu você.</p></div>`;
    return;
  }
  if (s.answered_today || state.justAnswered) {
    $("#tab").innerHTML = `<div class="card hero pop"><div class="big">✅</div><h2 style="margin-top:12px">Resposta de hoje registrada</h2>
      <p class="muted">Obrigado! Volte amanhã para responder de novo${s.days_left>0?` — você ainda tem ${s.days_left} ${s.days_left===1?"dia":"dias"}`:""}.</p>
      <div class="stats"><div class="stat"><b>${s.total_responses}</b><span>respostas suas</span></div><div class="stat"><b>${s.total_responses}</b><span>${s.total_responses===1?"chance":"chances"} no sorteio</span></div></div></div>`;
    return;
  }
  $("#tab").innerHTML = `
  <div class="card">
    <h2>Como estava sua refeição hoje?</h2>
    <div class="opts" role="radiogroup" aria-label="Avaliação da refeição">
      ${RATINGS.map(r => `<button type="button" class="opt" role="radio" aria-checked="false" style="--c:${r.c}" data-v="${r.v}"><span class="e">${r.e}</span><span class="t">${r.t}</span></button>`).join("")}
    </div>
    <label for="cm">Quer nos contar mais? <span class="muted" style="font-weight:400">(opcional)</span></label>
    <textarea id="cm" maxlength="1000" placeholder="Elogio, sugestão ou problema — a gestão lê e responde."></textarea>
    <div class="hint" id="cnt">0/1000</div>
    <div id="msg"></div>
    <button class="btn" id="send" disabled>Enviar resposta</button>
  </div>`;
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    state.rating = +b.dataset.v;
    document.querySelectorAll(".opt").forEach(x => { const on = x===b; x.classList.toggle("sel",on); x.setAttribute("aria-checked",on); });
    $("#send").disabled = false;
  }));
  $("#cm").addEventListener("input", e => $("#cnt").textContent = e.target.value.length + "/1000");
  $("#send").addEventListener("click", async () => {
    const btn = $("#send"); btn.disabled = true; btn.textContent = "Enviando...";
    try {
      await api("submit_response",{p_token:token(),p_rating:state.rating,p_comment:$("#cm").value});
      state.justAnswered = true;
      state.status = await api("my_status",{p_token:token()});
      state.comments = null;
      renderHome();
    } catch(e){
      if (/Sessão expirada/.test(e.message)) { setToken(null); return authView("login", e.message); }
      $("#msg").innerHTML = errBox(e.message);
      btn.disabled = false; btn.textContent = "Enviar resposta";
    }
  });
}

async function commentsTab(){
  $("#tab").innerHTML = `<div class="spin"></div>`;
  try {
    const list = await api("my_comments",{p_token:token()});
    const hadUnread = state.status.unread_replies > 0;
    if (!list.length) {
      $("#tab").innerHTML = `<div class="card hero"><div class="big">💬</div><h2 style="margin-top:12px">Nenhum comentário ainda</h2><p class="muted">Quando você deixar um comentário na pesquisa, a resposta da gestão aparece aqui.</p></div>`;
      return;
    }
    $("#tab").innerHTML = `<div class="card">${list.map(it => {
      const r = R(it.rating);
      return `<div class="item">
        <div class="meta"><span>${fmtDate(it.date)}</span><span class="chip" style="--c:${r.c}">${r.e} ${r.t}</span></div>
        <div class="mine">${esc(it.comment)}</div>
        ${it.replies.length
          ? it.replies.map(rp => `<div class="reply ${rp.unread?"new":""}"><small>Resposta da gestão · ${fmtDT(rp.created_at)}${rp.unread?" · NOVA":""}</small>${esc(rp.message)}</div>`).join("")
          : `<div class="wait">Aguardando resposta da gestão…</div>`}
      </div>`;
    }).join("")}</div>`;
    if (hadUnread) {
      await api("mark_replies_read",{p_token:token()});
      state.status.unread_replies = 0;
      const tb = document.querySelector(".tabs .badge"); if (tb) tb.remove();
    }
  } catch(e){
    if (/Sessão expirada/.test(e.message)) { setToken(null); return authView("login", e.message); }
    $("#tab").innerHTML = `<div class="card">${errBox(e.message)}</div>`;
  }
}

boot();
</script>
</body>
</html>
